<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLI — Shisir's Personal AI</title>

<style>
:root{
  --bg:#06090e;
  --panel:#0d131c;
  --panel2:#111a25;
  --line:#202c3c;
  --text:#f1f7ff;
  --muted:#8492a5;
  --cyan:#62e8f5;
  --violet:#a996ff;
  --green:#5ee39a;
  --amber:#ffd477;
  --red:#ff7189;
  --radius:22px;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0%,#12333d 0,transparent 30%),
    radial-gradient(circle at 90% 90%,#25183e 0,transparent 34%),
    var(--bg);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
  font:inherit;
}

button{cursor:pointer}

.shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:245px 1fr;
}

/* SIDEBAR */

.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  padding:22px 15px;
  border-right:1px solid var(--line);
  background:#070b11dd;
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
}

.logo-box{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px;
  margin-bottom:32px;
}

.logo{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#061016;
  font-size:22px;
  font-weight:900;
  background:linear-gradient(135deg,var(--cyan),#fff);
  box-shadow:0 0 35px #62e8f544;
}

.logo-text b{
  display:block;
  letter-spacing:.22em;
  font-size:15px;
}

.logo-text span{
  color:#647286;
  font-size:8px;
  letter-spacing:.2em;
}

.menu-title{
  color:#596779;
  font-size:9px;
  letter-spacing:.2em;
  margin:0 10px 9px;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:13px;
  border-radius:13px;
  text-align:left;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  color:var(--text);
  background:#ffffff0b;
}

.nav button.active{
  box-shadow:inset 2px 0 var(--cyan);
}

.profile{
  margin-top:auto;
  padding:15px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,#141d2b,#0c121b);
}

.profile-name{
  font-weight:700;
}

.profile-status{
  color:var(--green);
  font-size:11px;
  margin-top:4px;
}

/* MAIN */

.main{
  width:100%;
  max-width:1450px;
  padding:30px clamp(18px,4vw,55px);
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.pill{
  border:1px solid #ffffff12;
  background:#ffffff05;
  border-radius:999px;
  padding:8px 12px;
  color:var(--muted);
  font-size:11px;
}

.online{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  margin-right:7px;
}

/* HERO */

.hero{
  margin:55px 0 28px;
}

.eyebrow{
  color:var(--cyan);
  font-size:10px;
  font-weight:800;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.hero h1{
  margin:12px 0;
  font-size:clamp(38px,6vw,72px);
  line-height:.95;
  letter-spacing:-.065em;
}

.gradient{
  background:linear-gradient(110deg,#fff,var(--cyan),var(--violet));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
  max-width:650px;
  line-height:1.7;
}

/* GRID */

.grid{
  display:grid;
  gap:18px;
}

.two{
  grid-template-columns:minmax(0,1.45fr) minmax(280px,.7fr);
}

.three{
  grid-template-columns:repeat(3,1fr);
}

.card{
  border:1px solid #ffffff11;
  border-radius:var(--radius);
  background:
    linear-gradient(145deg,#131b27ee,#0c121add);
  box-shadow:0 25px 70px #0005;
}

/* AI */

.ai-card{
  min-height:470px;
  padding:26px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  position:relative;
}

.ai-card:before{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  right:-100px;
  top:-100px;
  border-radius:50%;
  background:#62e8f51b;
  filter:blur(20px);
}

.ai-top{
  position:relative;
  z-index:1;
}

.ai-title{
  font-size:clamp(27px,3vw,42px);
  letter-spacing:-.05em;
  margin:15px 0;
  max-width:650px;
}

.koli-orb{
  width:62px;
  height:62px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 35% 30%,#fff,var(--cyan) 25%,#16808c 65%,#091b20);
  box-shadow:
    0 0 25px #62e8f566,
    0 0 80px #62e8f522;
  animation:pulse 3s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.05);
    box-shadow:0 0 45px #62e8f588,0 0 100px #62e8f533;
  }
}

.quick{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.quick button,
.secondary{
  border:1px solid #ffffff13;
  background:#ffffff07;
  color:var(--muted);
  padding:10px 13px;
  border-radius:12px;
}

.quick button:hover,
.secondary:hover{
  color:var(--text);
  border-color:#62e8f555;
}

.chat{
  position:relative;
  z-index:2;
}

.composer{
  display:flex;
  gap:7px;
  padding:7px;
  border:1px solid #ffffff16;
  background:#060a0fcc;
  border-radius:16px;
}

.composer input{
  flex:1;
